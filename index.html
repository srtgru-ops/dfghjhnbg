<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07513f">
  <title>قياس مدى فهم تحديثات منصة العمل التطوعي | إمارة منطقة تبوك</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#173b34;background:#f2f6f2}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{background:linear-gradient(180deg,#e7f0e9 0,#f5f8f3 70%,#eef4ed 100%)}
    .banner{display:block;width:100%;height:auto;max-width:1774px;margin:0 auto}
    .hero{background:#d7e6dc;border-bottom:5px solid #bb9c62}
    .survey{padding:30px 18px 50px}
    .survey-frame{max-width:1060px;height:max(880px,100dvh);margin:auto;overflow:hidden;background:#edf2f2;border:1px solid #d5e2d9;border-radius:22px;box-shadow:0 18px 48px rgba(7,75,55,.12)}
    /* The deployed Apps Script still contains its former 160px title bar. */
    iframe{display:block;width:100%;height:calc(100% + 160px);margin-top:-160px;border:0;background:#edf2f2}
    .fallback{max-width:980px;margin:25px auto;padding:20px;border-radius:14px;background:#fff;color:#07513f}
    @media(max-width:700px){
      .survey{padding:16px 8px 30px}
      .survey-frame{height:max(780px,100dvh);border-radius:14px}
      iframe{height:calc(100% + 185px);margin-top:-185px}
    }
  </style>
</head>
<body>
  <header class="hero"><img class="banner" src="./banner.webp" alt="قياس مدى فهم تحديثات منصة العمل التطوعي بإمارة منطقة تبوك، مع شعارات إمارة منطقة تبوك وجامعة تبوك والمنصة الوطنية للعمل التطوعي وإدامة" width="1774" height="887"></header>
  <main class="survey">
    <div class="survey-frame"><iframe id="app" title="استبانة قياس المعرفة والاحتياجات" loading="eager"></iframe></div>
    <p id="notice" class="fallback" hidden>تعذّر تحميل الاستبانة. يُرجى تحديث الصفحة والمحاولة مرة أخرى.</p>
  </main>
  <script>
    const APP_URL='https://script.google.com/macros/s/AKfycbw_bJ40ZPJAXIDtptH466Hq1uHLr5VpMZ_Mhi01NCHxVKvNbz-3bGiG5ekRsfHsTKOB/exec';
    const app=document.querySelector('#app');
    if(APP_URL.startsWith('https://script.google.com/macros/s/')&&APP_URL.endsWith('/exec')) app.src=APP_URL;
    else {app.hidden=true;document.querySelector('#notice').hidden=false}
  </script>
</body>
</html>
